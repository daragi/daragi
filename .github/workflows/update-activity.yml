name: Update public activity

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update recent public activity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-activity.ps1

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No activity changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update public activity"
          git push
